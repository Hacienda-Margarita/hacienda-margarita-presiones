<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firma de visita - Hacienda Margarita</title>
<style>body{font:16px system-ui;background:#f4f7f4;color:#243c32;margin:0;padding:20px}.card{max-width:480px;margin:20px auto;background:white;border-radius:14px;padding:22px}canvas{width:100%;height:190px;border:2px solid #abc1b3;border-radius:8px;touch-action:none}button{font:inherit;border:0;border-radius:8px;padding:12px;background:#286b50;color:white;margin:8px 6px 0 0}</style></head><body><main class="card"><h1>Hacienda Margarita</h1><h2>Firma de entrada</h2><p id="visitor">Verificando enlace…</p><p>El empleado de recepción verificará su identidad. Firme con el dedo.</p><div id="signing" hidden><canvas id="pad" width="600" height="260"></canvas><button id="clear">Borrar</button><button id="send">Confirmar firma</button></div><p id="status" role="status"></p></main><script>
const API='https://uazmikfffebbkxfqnrbm.supabase.co/functions/v1/hm-firma-visita',KEY='sb_publishable_LQyb9dTKiXX7R2svKtQotg_k79AixpR',token=new URLSearchParams(location.search).get('token')||'';
const $=id=>document.getElementById(id);let strokes=[],current=null,down=false;const canvas=$('pad'),ctx=canvas.getContext('2d');
async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,token,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'Error de conexión');return d}
function point(e){const b=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))]}
function paint(){ctx.clearRect(0,0,600,260);ctx.strokeStyle='#183f31';ctx.lineWidth=3;ctx.lineCap='round';for(const s of strokes){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0]*600,p[1]*260):ctx.moveTo(p[0]*600,p[1]*260));ctx.stroke()}}
canvas.onpointerdown=e=>{e.preventDefault();down=true;current=[point(e)];strokes.push(current);canvas.setPointerCapture(e.pointerId);paint()};
canvas.onpointermove=e=>{if(!down)return;e.preventDefault();if(current.length<700)current.push(point(e));paint()};
canvas.onpointerup=canvas.onpointercancel=()=>{down=false;current=null};
$('clear').onclick=()=>{strokes=[];paint();$('status').textContent=''};
$('send').onclick=async()=>{if(!strokes.some(s=>s.length>=2))return $('status').textContent='Dibuje su firma.';$('send').disabled=true;try{await call('sign',{strokes});$('signing').hidden=true;$('visitor').textContent='Firma recibida correctamente.';$('status').textContent='Gracias. Informe al empleado.';history.replaceState(null,'',location.pathname)}catch(e){$('status').textContent=e.message;$('send').disabled=false}};
(async()=>{try{const d=await call('view');$('visitor').textContent='Visitante: '+d.visitor;$('signing').hidden=false}catch(e){$('visitor').textContent='No se puede firmar';$('status').textContent=e.message}})();
</script></body></html>
